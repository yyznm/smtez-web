name: Build DLL

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-dll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and smtweb.dll
        run: powershell -ExecutionPolicy Bypass -File server/build.ps1

      - name: Package plugin zip
        shell: pwsh
        run: |
          $name = 'smtweb-plugin'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $name = "smtweb-plugin-$env:GITHUB_REF_NAME" }
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Compress-Archive -Path server/bin/smtweb.dll, server/bin/smtweb.plugin.json -DestinationPath "package/$name.zip" -Force

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: smtweb-plugin
          path: package/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem package/*.zip).FullName
          gh release create $env:GITHUB_REF_NAME $zip --title $env:GITHUB_REF_NAME --generate-notes
