name: Build DLL

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-dll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and smtweb.dll
        run: powershell -ExecutionPolicy Bypass -File server/build.ps1

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: smtweb-plugin
          path: |
            server/bin/smtweb.dll
            server/bin/smtweb.plugin.json
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME server/bin/smtweb.dll server/bin/smtweb.plugin.json --title $env:GITHUB_REF_NAME --generate-notes
